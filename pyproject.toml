[project]
name = "from-tensors-to-agents"
version = "0.1.0"
description = "Executable companion material for From Tensors to Agents"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy>=2.0", "torch>=2.4", "psutil>=6.0", "pypdf>=5.0"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]
embeddings = [
    "sentence-transformers>=5.0,<6.0",
]
mlx = [
    "mlx>=0.31,<0.32",
    "mlx-lm>=0.31,<0.32",
]
tensorflow = [
    "tensorflow>=2.21,<2.22",
]
transformers = [
    "transformers>=5.0,<6.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/from_tensors_to_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
