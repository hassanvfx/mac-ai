<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250" role="img" aria-labelledby="t d">
<title id="t">Transformer inference data flow</title><desc id="d">Text becomes tokens, model inputs, contextual representations, logits, and a label.</desc>
<style>.b{fill:#f7f7f4;stroke:#243447;stroke-width:4}.a{fill:#e7ddf4;stroke:#684a91;stroke-width:4}.o{fill:#e6f2df;stroke:#477a39;stroke-width:4}.l{font-family:Arial,sans-serif;font-size:42px;font-weight:700;fill:#17212b;text-anchor:middle}.s{font-family:Arial,sans-serif;font-size:32px;fill:#34495e;text-anchor:middle}.r{stroke:#425466;stroke-width:7;fill:none;marker-end:url(#m)}</style>
<defs><marker id="m" markerWidth="15" markerHeight="15" refX="12" refY="7" orient="auto"><path d="M0,0 L15,7 L0,14 Z" fill="#425466"/></marker></defs><rect width="1000" height="1250" fill="white"/>
<text x="500" y="70" class="l">A prediction is a chain of input contracts</text>
<g transform="translate(120 130)"><rect class="b" width="760" height="150" rx="20"/><text x="380" y="60" class="l">1. Text</text><text x="380" y="110" class="s">human-readable input</text></g><path class="r" d="M500 290V350"/>
<g transform="translate(120 360)"><rect class="a" width="760" height="170" rx="20"/><text x="380" y="60" class="l">2. Tokenizer</text><text x="380" y="110" class="s">tokens, IDs, and attention mask</text><text x="380" y="145" class="s">vocabulary is part of the contract</text></g><path class="r" d="M500 540V600"/>
<g transform="translate(120 610)"><rect class="b" width="760" height="170" rx="20"/><text x="380" y="60" class="l">3. Model inputs</text><text x="380" y="110" class="s">input IDs + mask</text><text x="380" y="145" class="s">padding positions are masked</text></g><path class="r" d="M500 790V850"/>
<g transform="translate(120 860)"><rect class="a" width="760" height="150" rx="20"/><text x="380" y="60" class="l">4. Transformer</text><text x="380" y="110" class="s">contextual vectors mix token context</text></g><path class="r" d="M500 1020V1080"/>
<g transform="translate(120 1090)"><rect class="o" width="760" height="110" rx="20"/><text x="380" y="48" class="l">5. Logits → label</text><text x="380" y="88" class="s">inspect the model-specific mapping</text></g>
</svg>
