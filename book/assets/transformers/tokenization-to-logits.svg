<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="620" viewBox="0 0 1800 620" role="img" aria-labelledby="t d"><title id="t">Transformer inference data flow</title><desc id="d">Text becomes tokens, IDs and attention mask, contextual representations, logits, and a label.</desc><style>.b{fill:#f7f7f4;stroke:#243447;stroke-width:5}.a{fill:#e7ddf4;stroke:#684a91;stroke-width:5}.o{fill:#e6f2df;stroke:#477a39;stroke-width:5}.l{font:700 29px Arial,sans-serif;fill:#17212b;text-anchor:middle}.s{font:24px Arial,sans-serif;fill:#34495e;text-anchor:middle}.r{stroke:#425466;stroke-width:7;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#425466"/></marker></defs><rect width="1800" height="620" fill="white"/><text x="900" y="65" class="l" style="font-size:40px">A prediction is a chain of input contracts, not text going directly into a model</text><g transform="translate(25 190)"><rect class="b" width="240" height="190" rx="20"/><text x="120" y="64" class="l">text</text><text x="120" y="115" class="s">human-readable</text></g><path class="r" d="M275 285H345"/><g transform="translate(360 190)"><rect class="a" width="260" height="190" rx="20"/><text x="130" y="61" class="l">tokenizer</text><text x="130" y="109" class="s">[CLS] ... [SEP]</text><text x="130" y="153" class="s">vocabulary contract</text></g><path class="r" d="M630 285H700"/><g transform="translate(715 190)"><rect class="b" width="285" height="190" rx="20"/><text x="142" y="58" class="l">model inputs</text><text x="142" y="106" class="s">input IDs + mask</text><text x="142" y="151" class="s">padding is masked</text></g><path class="r" d="M1010 285H1080"/><g transform="translate(1095 190)"><rect class="a" width="280" height="190" rx="20"/><text x="140" y="60" class="l">Transformer</text><text x="140" y="108" class="s">contextual vectors</text><text x="140" y="153" class="s">attention mixes context</text></g><path class="r" d="M1385 285H1455"/><g transform="translate(1470 190)"><rect class="o" width="300" height="190" rx="20"/><text x="150" y="57" class="l">classifier output</text><text x="150" y="104" class="s">logits → softmax → label</text><text x="150" y="151" class="s">model-specific mapping</text></g><text x="900" y="515" class="s" style="font-size:28px">Inspect tokens, mask, revision, logits, label mapping, and device before interpreting the final label.</text></svg>
