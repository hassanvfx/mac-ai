<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="620" viewBox="0 0 1800 620" role="img" aria-labelledby="title desc">
  <title id="title">Tiny CNN feature flow</title><desc id="desc">A 16 by 16 grayscale image flows through convolution, pooling, convolution, global average pooling, and a three-class output.</desc>
  <style>.box{fill:#f7f7f4;stroke:#243447;stroke-width:5}.accent{fill:#dcecf5;stroke:#1e628c;stroke-width:5}.out{fill:#e6f2df;stroke:#477a39;stroke-width:5}.label{font:700 30px Arial,sans-serif;fill:#17212b;text-anchor:middle}.shape{font:25px Arial,sans-serif;fill:#34495e;text-anchor:middle}.arrow{stroke:#425466;stroke-width:7;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#425466"/></marker></defs><rect width="1800" height="620" fill="white"/>
  <text x="900" y="70" class="label" style="font-size:40px">A small CNN preserves the batch and transforms the feature axes</text>
  <g transform="translate(35 200)"><rect class="box" width="225" height="180" rx="20"/><text x="112" y="65" class="label">input image</text><text x="112" y="120" class="shape">(N, 1, 16, 16)</text><text x="112" y="158" class="shape">grayscale pixels</text></g><path class="arrow" d="M270 290H345"/>
  <g transform="translate(360 200)"><rect class="accent" width="235" height="180" rx="20"/><text x="118" y="60" class="label">Conv + ReLU</text><text x="118" y="108" class="shape">8 learned filters</text><text x="118" y="150" class="shape">(N, 8, 16, 16)</text></g><path class="arrow" d="M605 290H680"/>
  <g transform="translate(695 200)"><rect class="box" width="205" height="180" rx="20"/><text x="102" y="64" class="label">max pool</text><text x="102" y="112" class="shape">local summary</text><text x="102" y="153" class="shape">(N, 8, 8, 8)</text></g><path class="arrow" d="M910 290H985"/>
  <g transform="translate(1000 200)"><rect class="accent" width="240" height="180" rx="20"/><text x="120" y="60" class="label">Conv + ReLU</text><text x="120" y="108" class="shape">16 learned filters</text><text x="120" y="150" class="shape">(N, 16, 8, 8)</text></g><path class="arrow" d="M1250 290H1325"/>
  <g transform="translate(1340 200)"><rect class="box" width="200" height="180" rx="20"/><text x="100" y="58" class="label">global avg.</text><text x="100" y="98" class="label">pool</text><text x="100" y="150" class="shape">(N, 16)</text></g><path class="arrow" d="M1550 290H1600"/>
  <g transform="translate(1610 200)"><rect class="out" width="160" height="180" rx="20"/><text x="80" y="62" class="label">linear</text><text x="80" y="108" class="shape">3 logits</text><text x="80" y="150" class="shape">(N, 3)</text></g>
  <text x="900" y="510" class="shape" style="font-size:28px">N is the number of independent images. Convolution changes channels; pooling reduces spatial detail; the classifier chooses among named classes.</text>
</svg>
