<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1220" viewBox="0 0 1000 1220" role="img" aria-labelledby="t d"><title id="t">Tiny CNN feature flow</title><desc id="d">An image flows through convolution, pooling, convolution, global average pooling, and a three-class output.</desc><style>.title{font-family:Arial,sans-serif;font-size:48px;font-weight:700;fill:#17212b;text-anchor:middle}.label{font-family:Arial,sans-serif;font-size:40px;font-weight:700;fill:#17212b;text-anchor:middle}.note{font-family:Arial,sans-serif;font-size:30px;fill:#34495e;text-anchor:middle}.box{fill:#f7f7f4;stroke:#243447;stroke-width:4}.blue{fill:#dcecf5;stroke:#1e628c;stroke-width:4}.out{fill:#e6f2df;stroke:#477a39;stroke-width:4}.arrow{fill:none;stroke:#425466;stroke-width:7;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="15" markerHeight="15" refX="12" refY="7" orient="auto"><path d="M0 0 L15 7 L0 14 Z" fill="#425466"/></marker></defs><rect width="1000" height="1220" fill="white"/><text class="title" x="500" y="70">A CNN changes feature axes step by step</text><g transform="translate(130 125)"><rect class="box" width="740" height="130" rx="18"/><text class="label" x="370" y="55">Input image</text><text class="note" x="370" y="100">(N, 1, 16, 16) grayscale pixels</text></g><path class="arrow" d="M500 265V315"/><g transform="translate(130 325)"><rect class="blue" width="740" height="130" rx="18"/><text class="label" x="370" y="55">Convolution + ReLU</text><text class="note" x="370" y="100">8 filters → (N, 8, 16, 16)</text></g><path class="arrow" d="M500 465V515"/><g transform="translate(130 525)"><rect class="box" width="740" height="130" rx="18"/><text class="label" x="370" y="55">Max pool</text><text class="note" x="370" y="100">local summary → (N, 8, 8, 8)</text></g><path class="arrow" d="M500 665V715"/><g transform="translate(130 725)"><rect class="blue" width="740" height="130" rx="18"/><text class="label" x="370" y="55">Convolution + ReLU</text><text class="note" x="370" y="100">16 filters → (N, 16, 8, 8)</text></g><path class="arrow" d="M500 865V915"/><g transform="translate(130 925)"><rect class="out" width="740" height="130" rx="18"/><text class="label" x="370" y="55">Global average pool → linear</text><text class="note" x="370" y="100">(N, 16) → 3 logits → (N, 3)</text></g><text class="note" x="500" y="1150">Convolution changes channels; pooling reduces spatial detail.</text></svg>
