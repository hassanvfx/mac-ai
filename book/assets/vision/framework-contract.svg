<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="820" viewBox="0 0 1800 820" role="img" aria-labelledby="title desc">
  <title id="title">One vision task, two framework presentations</title><desc id="desc">A shared synthetic fixture branches to PyTorch channels-first and Keras channels-last layout, then converges on shared held-out evaluation. Timing is outside the comparison.</desc>
  <style>.box{fill:#f7f7f4;stroke:#243447;stroke-width:5}.blue{fill:#dcecf5;stroke:#1e628c;stroke-width:5}.orange{fill:#fff1d6;stroke:#9a6719;stroke-width:5}.green{fill:#e6f2df;stroke:#477a39;stroke-width:5}.label{font:700 29px Arial,sans-serif;fill:#17212b;text-anchor:middle}.small{font:24px Arial,sans-serif;fill:#34495e;text-anchor:middle}.arrow{stroke:#425466;stroke-width:7;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#425466"/></marker></defs><rect width="1800" height="820" fill="white"/>
  <text x="900" y="58" class="label" style="font-size:40px">Compare the task contract before framework syntax</text>
  <g transform="translate(70 280)"><rect class="box" width="310" height="210" rx="20"/><text x="155" y="58" class="label">shared fixture</text><text x="155" y="105" class="small">strokes, labels, splits,</text><text x="155" y="139" class="small">seed, topology, Adam,</text><text x="155" y="173" class="small">epochs, held-out metrics</text></g>
  <path class="arrow" d="M390 385H510V205H610"/><path class="arrow" d="M390 385H510V565H610"/>
  <g transform="translate(625 105)"><rect class="blue" width="410" height="200" rx="20"/><text x="205" y="55" class="label">PyTorch presentation</text><text x="205" y="101" class="small">NCHW: (N, 1, 16, 16)</text><text x="205" y="135" class="small">explicit forward / loss /</text><text x="205" y="169" class="small">backward / optimizer step</text></g>
  <g transform="translate(625 465)"><rect class="orange" width="410" height="200" rx="20"/><text x="205" y="55" class="label">Keras presentation</text><text x="205" y="101" class="small">NHWC: (N, 16, 16, 1)</text><text x="205" y="135" class="small">explicit layout conversion;</text><text x="205" y="169" class="small">compile / fit history</text></g>
  <path class="arrow" d="M1045 205H1160V345H1270"/><path class="arrow" d="M1045 565H1160V425H1270"/>
  <g transform="translate(1285 280)"><rect class="green" width="430" height="210" rx="20"/><text x="215" y="55" class="label">shared evaluation</text><text x="215" y="101" class="small">test accuracy + confusion matrix</text><text x="215" y="135" class="small">+ named mistake list</text><text x="215" y="176" class="small">not a speed leaderboard</text></g>
  <text x="900" y="755" class="small" style="font-size:27px">Keep device, batching, initialization, warm-up, timing, and memory as recorded differences. Do not infer framework performance from this correctness exercise.</text>
</svg>
