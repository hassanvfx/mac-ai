<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1160" viewBox="0 0 1000 1160" role="img"><style>.t{font-family:Arial,sans-serif;font-size:48px;font-weight:700;fill:#17212b;text-anchor:middle}.l{font-family:Arial,sans-serif;font-size:40px;font-weight:700;fill:#17212b;text-anchor:middle}.n{font-family:Arial,sans-serif;font-size:30px;fill:#34495e;text-anchor:middle}.b{fill:#f7f7f4;stroke:#243447;stroke-width:4}.p{fill:#dcecf5;stroke:#1e628c;stroke-width:4}.k{fill:#fff1d6;stroke:#9a6719;stroke-width:4}.e{fill:#e6f2df;stroke:#477a39;stroke-width:4}.a{fill:none;stroke:#425466;stroke-width:7;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="15" markerHeight="15" refX="12" refY="7" orient="auto"><path d="M0 0L15 7L0 14Z" fill="#425466"/></marker></defs><rect width="1000" height="1160" fill="white"/><text class="t" x="500" y="70">Compare the task before framework syntax</text><g transform="translate(130 130)"><rect class="b" width="740" height="150" rx="18"/><text class="l" x="370" y="62">Shared fixture</text><text class="n" x="370" y="112">same images, labels, split, seed, and metrics</text></g><path class="a" d="M500 295V345H275V400"/><path class="a" d="M500 345H725V400"/><g transform="translate(80 420)"><rect class="p" width="390" height="190" rx="18"/><text class="l" x="195" y="62">PyTorch</text><text class="n" x="195" y="108">NCHW tensors</text><text class="n" x="195" y="148">forward / loss / backward</text></g><g transform="translate(530 420)"><rect class="k" width="390" height="190" rx="18"/><text class="l" x="195" y="62">Keras</text><text class="n" x="195" y="108">NHWC tensors</text><text class="n" x="195" y="148">convert / compile / fit</text></g><path class="a" d="M275 625V700H500V760"/><path class="a" d="M725 625V700H500"/><g transform="translate(130 780)"><rect class="e" width="740" height="170" rx="18"/><text class="l" x="370" y="65">Shared evaluation</text><text class="n" x="370" y="115">test accuracy, confusion matrix, named mistakes</text></g><text class="n" x="500" y="1040">Correctness comparison, not a speed leaderboard.</text></svg>
