<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1320" viewBox="0 0 1000 1320" role="img" aria-labelledby="title desc">
  <title id="title">Forward computation and backward gradient flow</title>
  <desc id="desc">A parameter produces a prediction and loss; the loss gradient flows backward to the parameter.</desc>
  <style>
    .title{font-family:Arial,sans-serif;font-size:52px;font-weight:700;fill:#172033;text-anchor:middle}.label{font-family:Arial,sans-serif;font-size:42px;font-weight:700;fill:#172033}.code{font-family:Menlo,monospace;font-size:38px;fill:#172033;text-anchor:middle}.note{font-family:Arial,sans-serif;font-size:33px;fill:#4b5563;text-anchor:middle}.box{fill:#f7f9fc;stroke:#172033;stroke-width:4}.loss{fill:#fff5f1;stroke:#b54708;stroke-width:4}.forward{fill:none;stroke:#245ca6;stroke-width:7;marker-end:url(#blue)}.back{fill:none;stroke:#b54708;stroke-width:7;stroke-dasharray:16 12;marker-end:url(#orange)}
  </style>
  <defs><marker id="blue" markerWidth="15" markerHeight="15" refX="12" refY="7" orient="auto"><path d="M0 0 L15 7 L0 14 Z" fill="#245ca6"/></marker><marker id="orange" markerWidth="15" markerHeight="15" refX="12" refY="7" orient="auto"><path d="M0 0 L15 7 L0 14 Z" fill="#b54708"/></marker></defs>
  <rect width="1000" height="1320" fill="white"/>
  <text class="title" x="500" y="70">A loss sends gradients backward</text>
  <text class="label" x="90" y="145">Forward pass</text>
  <rect class="box" x="150" y="185" width="700" height="180" rx="22"/><text class="label" x="500" y="245" text-anchor="middle">Parameter</text><text class="code" x="500" y="300">weight = 3</text><text class="note" x="500" y="340">requires_grad = True</text>
  <path class="forward" d="M500 385V455"/><text class="note" x="735" y="430">multiply by 2</text>
  <rect class="box" x="150" y="475" width="700" height="180" rx="22"/><text class="label" x="500" y="535" text-anchor="middle">Prediction</text><text class="code" x="500" y="590">2 × weight = 6</text><text class="note" x="500" y="630">target = 10</text>
  <path class="forward" d="M500 675V745"/><text class="note" x="735" y="720">compare to target</text>
  <rect class="loss" x="150" y="765" width="700" height="180" rx="22"/><text class="label" x="500" y="825" text-anchor="middle">Loss</text><text class="code" x="500" y="880">(6 − 10)² = 16</text>
  <text class="label" x="90" y="1035">Backward pass</text>
  <path class="back" d="M500 965V1035H790V675"/><text class="note" x="500" y="1085">d(loss)/d(prediction) = −8</text>
  <path class="back" d="M500 965V1165H220V385"/><text class="note" x="500" y="1235">d(loss)/d(weight) = −16</text>
  <text class="note" x="500" y="1290">Autograd applies the chain rule; the optimizer uses the gradient.</text>
</svg>
