<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1280" viewBox="0 0 1000 1280" role="img" aria-labelledby="t d">
<title id="t">A minimal PyTorch training loop</title><desc id="d">Six readable steps: clear gradients, forward pass, measure loss, backward pass, update parameters, and observe.</desc>
<style>.title{font-family:Arial,sans-serif;font-size:50px;font-weight:700;fill:#172033;text-anchor:middle}.step{font-family:Arial,sans-serif;font-size:42px;font-weight:700;fill:#172033;text-anchor:middle}.note{font-family:Arial,sans-serif;font-size:32px;fill:#4b5563;text-anchor:middle}.box{fill:#f7f9fc;stroke:#172033;stroke-width:4}.blue{fill:#edf4ff;stroke:#245ca6;stroke-width:4}.green{fill:#edf8f1;stroke:#247348;stroke-width:4}.arrow{fill:none;stroke:#245ca6;stroke-width:7;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="15" markerHeight="15" refX="12" refY="7" orient="auto"><path d="M0 0 L15 7 L0 14 Z" fill="#245ca6"/></marker></defs><rect width="1000" height="1280" fill="white"/>
<text class="title" x="500" y="70">One visible training step</text>
<g transform="translate(140 125)"><rect class="box" width="720" height="115" rx="18"/><text class="step" x="360" y="50">1. Clear gradients</text><text class="note" x="360" y="90">remove values from the prior step</text></g><path class="arrow" d="M500 250V300"/>
<g transform="translate(140 310)"><rect class="blue" width="720" height="115" rx="18"/><text class="step" x="360" y="50">2. Forward pass</text><text class="note" x="360" y="90">compute a prediction from inputs</text></g><path class="arrow" d="M500 435V485"/>
<g transform="translate(140 495)"><rect class="box" width="720" height="115" rx="18"/><text class="step" x="360" y="50">3. Measure loss</text><text class="note" x="360" y="90">compare prediction with target</text></g><path class="arrow" d="M500 620V670"/>
<g transform="translate(140 680)"><rect class="blue" width="720" height="115" rx="18"/><text class="step" x="360" y="50">4. Backward pass</text><text class="note" x="360" y="90">compute parameter gradients</text></g><path class="arrow" d="M500 805V855"/>
<g transform="translate(140 865)"><rect class="green" width="720" height="115" rx="18"/><text class="step" x="360" y="50">5. Update parameters</text><text class="note" x="360" y="90">optimizer takes one step</text></g><path class="arrow" d="M500 990V1040"/>
<g transform="translate(140 1050)"><rect class="box" width="720" height="115" rx="18"/><text class="step" x="360" y="50">6. Observe and repeat</text><text class="note" x="360" y="90">record loss, device, and next question</text></g><text class="note" x="500" y="1240">Repeat with the same seed and declared measurement method.</text>
</svg>
