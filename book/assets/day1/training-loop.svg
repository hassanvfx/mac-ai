<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="870" viewBox="0 0 1500 870" role="img" aria-labelledby="title desc">
  <title id="title">A minimal PyTorch training loop</title><desc id="desc">A circular process: clear gradients, forward pass, measure loss, backward pass, update parameters, observe, and repeat.</desc>
  <style>.h{font:600 29px Arial,sans-serif;fill:#172033}.d{font:21px Arial,sans-serif;fill:#4b5563}.c{font:21px Menlo,monospace;fill:#172033}.s{fill:#f7f9fc;stroke:#172033;stroke-width:3}.e{fill:#edf4ff;stroke:#245ca6;stroke-width:3}.u{fill:#edf8f1;stroke:#247348;stroke-width:3}.a{fill:none;stroke:#245ca6;stroke-width:5;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#245ca6"/></marker></defs>
  <rect width="1500" height="870" fill="#ffffff"/>
  <text class="h" x="90" y="78">One training step: make the learning loop visible</text>
  <g><rect class="s" x="105" y="155" width="270" height="165" rx="18"/><text class="h" x="180" y="215">1. Clear</text><text class="c" x="135" y="260">optimizer.zero_grad()</text><text class="d" x="143" y="298">remove prior gradients</text></g>
  <g><rect class="e" x="590" y="155" width="320" height="165" rx="18"/><text class="h" x="685" y="215">2. Forward</text><text class="c" x="630" y="260">prediction = model(x)</text><text class="d" x="644" y="298">compute outputs from inputs</text></g>
  <g><rect class="s" x="1125" y="155" width="270" height="165" rx="18"/><text class="h" x="1195" y="215">3. Measure</text><text class="c" x="1158" y="260">loss = mse(pred, y)</text><text class="d" x="1170" y="298">turn error into one number</text></g>
  <g><rect class="e" x="1125" y="535" width="270" height="165" rx="18"/><text class="h" x="1190" y="595">4. Backward</text><text class="c" x="1175" y="640">loss.backward()</text><text class="d" x="1162" y="678">compute parameter gradients</text></g>
  <g><rect class="u" x="590" y="535" width="320" height="165" rx="18"/><text class="h" x="680" y="595">5. Update</text><text class="c" x="642" y="640">optimizer.step()</text><text class="d" x="625" y="678">move parameters using gradients</text></g>
  <g><rect class="s" x="105" y="535" width="270" height="165" rx="18"/><text class="h" x="170" y="595">6. Observe</text><text class="c" x="148" y="640">record loss + device</text><text class="d" x="142" y="678">compare with prior steps</text></g>
  <path class="a" d="M380 237H580"/><path class="a" d="M915 237H1115"/><path class="a" d="M1260 325V525"/><path class="a" d="M1115 618H920"/><path class="a" d="M580 618H385"/><path class="a" d="M240 525V330"/><text class="d" x="390" y="795">Repeat over epochs. For a meaningful record, also keep the seed, dataset, model, device, measurement method, and limitations.</text>
</svg>
