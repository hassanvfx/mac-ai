<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1320" viewBox="0 0 1000 1320" role="img" aria-labelledby="title desc">
  <title id="title">Broadcasting a feature bias across a batch</title>
  <desc id="desc">A two by three batch receives the same three-value feature bias in each row, producing a two by three result.</desc>
  <style>
    .title{font-family:Arial,sans-serif;font-size:52px;font-weight:700;fill:#172033;text-anchor:middle}.label{font-family:Arial,sans-serif;font-size:42px;font-weight:700;fill:#172033}.note{font-family:Arial,sans-serif;font-size:34px;fill:#4b5563}.value{font-family:Menlo,monospace;font-size:40px;fill:#172033;text-anchor:middle}.cell{fill:#f7f9fc;stroke:#172033;stroke-width:4}.bias{fill:#edf4ff;stroke:#245ca6;stroke-width:4}.result{fill:#edf8f1;stroke:#247348;stroke-width:4}.arrow{fill:none;stroke:#245ca6;stroke-width:7;marker-end:url(#head)}
  </style>
  <defs><marker id="head" markerWidth="15" markerHeight="15" refX="12" refY="7" orient="auto"><path d="M0 0 L15 7 L0 14 Z" fill="#245ca6"/></marker></defs>
  <rect width="1000" height="1320" fill="white"/>
  <text class="title" x="500" y="70">Broadcast a feature bias</text>
  <text class="label" x="90" y="150">1. Batch: shape (2, 3)</text>
  <g transform="translate(160 190)"><rect class="cell" width="220" height="110"/><rect class="cell" x="220" width="220" height="110"/><rect class="cell" x="440" width="220" height="110"/><rect class="cell" y="110" width="220" height="110"/><rect class="cell" x="220" y="110" width="220" height="110"/><rect class="cell" x="440" y="110" width="220" height="110"/><text class="value" x="110" y="70">1</text><text class="value" x="330" y="70">2</text><text class="value" x="550" y="70">3</text><text class="value" x="110" y="180">4</text><text class="value" x="330" y="180">5</text><text class="value" x="550" y="180">6</text></g>
  <path class="arrow" d="M500 450V535"/><text class="note" x="180" y="505">add the same bias to each row</text>
  <text class="label" x="90" y="610">2. Feature bias: shape (3,)</text>
  <g transform="translate(160 650)"><rect class="bias" width="220" height="110"/><rect class="bias" x="220" width="220" height="110"/><rect class="bias" x="440" width="220" height="110"/><text class="value" x="110" y="70">0.1</text><text class="value" x="330" y="70">0.2</text><text class="value" x="550" y="70">0.3</text></g>
  <path class="arrow" d="M500 820V905"/><text class="note" x="190" y="875">align the trailing feature dimension</text>
  <text class="label" x="90" y="980">3. Result: shape (2, 3)</text>
  <g transform="translate(160 1020)"><rect class="result" width="220" height="110"/><rect class="result" x="220" width="220" height="110"/><rect class="result" x="440" width="220" height="110"/><rect class="result" y="110" width="220" height="110"/><rect class="result" x="220" y="110" width="220" height="110"/><rect class="result" x="440" y="110" width="220" height="110"/><text class="value" x="110" y="70">1.1</text><text class="value" x="330" y="70">2.2</text><text class="value" x="550" y="70">3.3</text><text class="value" x="110" y="180">4.1</text><text class="value" x="330" y="180">5.2</text><text class="value" x="550" y="180">6.3</text></g>
  <text class="note" x="90" y="1290">One value per feature, repeated for every example.</text>
</svg>
