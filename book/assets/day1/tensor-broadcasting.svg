<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Broadcasting a feature bias across a batch</title><desc id="desc">A two-by-three batch plus a three-element bias produces a two-by-three result.</desc>
  <style>.h{font:600 32px Arial,sans-serif;fill:#172033}.s{font:24px Arial,sans-serif;fill:#4b5563}.v{font:28px Menlo,monospace;fill:#172033}.n{font:22px Arial,sans-serif;fill:#4b5563}.c{fill:#f7f9fc;stroke:#172033;stroke-width:3}.b{fill:#edf4ff;stroke:#245ca6;stroke-width:3}.r{fill:#edf8f1;stroke:#247348;stroke-width:3}.op{font:56px Georgia,serif;fill:#172033}.a{fill:none;stroke:#245ca6;stroke-width:4;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#245ca6"/></marker></defs>
  <rect width="1500" height="760" fill="#ffffff"/>
  <text class="h" x="110" y="88">Batch: two examples × three features</text><text class="s" x="110" y="124">shape (2, 3)</text>
  <g transform="translate(110 165)"><rect class="c" width="120" height="90"/><rect class="c" x="120" width="120" height="90"/><rect class="c" x="240" width="120" height="90"/><rect class="c" y="90" width="120" height="90"/><rect class="c" x="120" y="90" width="120" height="90"/><rect class="c" x="240" y="90" width="120" height="90"/><text class="v" x="44" y="57">1</text><text class="v" x="164" y="57">2</text><text class="v" x="284" y="57">3</text><text class="v" x="44" y="147">4</text><text class="v" x="164" y="147">5</text><text class="v" x="284" y="147">6</text></g>
  <text class="op" x="540" y="305">+</text><text class="h" x="650" y="88">Feature bias</text><text class="s" x="650" y="124">shape (3,)</text>
  <g transform="translate(650 210)"><rect class="b" width="120" height="90"/><rect class="b" x="120" width="120" height="90"/><rect class="b" x="240" width="120" height="90"/><text class="v" x="28" y="57">0.1</text><text class="v" x="148" y="57">0.2</text><text class="v" x="268" y="57">0.3</text></g>
  <path class="a" d="M710 350C710 460 710 500 710 545"/><path class="a" d="M830 350C830 460 830 500 830 545"/><path class="a" d="M950 350C950 460 950 500 950 545"/><text class="n" x="642" y="415">same bias is applied to each row</text>
  <text class="op" x="1080" y="305">=</text><text class="h" x="1180" y="88">Result</text><text class="s" x="1180" y="124">shape (2, 3)</text>
  <g transform="translate(1130 165)"><rect class="r" width="120" height="90"/><rect class="r" x="120" width="120" height="90"/><rect class="r" x="240" width="120" height="90"/><rect class="r" y="90" width="120" height="90"/><rect class="r" x="120" y="90" width="120" height="90"/><rect class="r" x="240" y="90" width="120" height="90"/><text class="v" x="24" y="57">1.1</text><text class="v" x="144" y="57">2.2</text><text class="v" x="264" y="57">3.3</text><text class="v" x="24" y="147">4.1</text><text class="v" x="144" y="147">5.2</text><text class="v" x="264" y="147">6.3</text></g>
  <text class="n" x="110" y="685">Broadcasting aligns trailing dimensions: the three-element bias supplies one value for each feature, not one value for each example.</text>
</svg>
