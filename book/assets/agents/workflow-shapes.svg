<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1220" viewBox="0 0 1000 1220" role="img"><style>.t{font-family:Arial,sans-serif;font-size:46px;font-weight:700;fill:#17212b;text-anchor:middle}.l{font-family:Arial,sans-serif;font-size:38px;font-weight:700;fill:#17212b;text-anchor:middle}.n{font-family:Arial,sans-serif;font-size:29px;fill:#34495e;text-anchor:middle}.b{fill:#f7f7f4;stroke:#243447;stroke-width:4}.x{fill:#dcecf5;stroke:#1e628c;stroke-width:4}.r{fill:#fff1d6;stroke:#9a6719;stroke-width:4}.g{fill:#e6f2df;stroke:#477a39;stroke-width:4}.a{fill:none;stroke:#425466;stroke-width:7;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="15" markerHeight="15" refX="12" refY="7" orient="auto"><path d="M0 0L15 7L0 14Z" fill="#425466"/></marker></defs><rect width="1000" height="1220" fill="white"/><text class="t" x="500" y="70">Choose a workflow that preserves evidence</text><g transform="translate(130 125)"><rect class="b" width="740" height="125" rx="18"/><text class="l" x="370" y="52">Frozen corpus</text><text class="n" x="370" y="95">real paths, citations, and editorial checks</text></g><path class="a" d="M500 260V310"/><g transform="translate(130 320)"><rect class="x" width="740" height="125" rx="18"/><text class="l" x="370" y="52">1. Deterministic workflow</text><text class="n" x="370" y="95">retrieve evidence, audit it, propose manually</text></g><path class="a" d="M500 455V505"/><g transform="translate(130 515)"><rect class="x" width="740" height="125" rx="18"/><text class="l" x="370" y="52">2. Single planner</text><text class="n" x="370" y="95">one retrieved context, one plan, one review</text></g><path class="a" d="M500 650V700"/><g transform="translate(130 710)"><rect class="x" width="740" height="125" rx="18"/><text class="l" x="370" y="52">3. Specialist roles</text><text class="n" x="370" y="95">researcher → critic → writer brief</text></g><path class="a" d="M500 845V895"/><g transform="translate(130 905)"><rect class="r" width="740" height="125" rx="18"/><text class="l" x="370" y="52">Shared contract</text><text class="n" x="370" y="95">cite evidence; identify gaps; create no write</text></g><path class="a" d="M500 1040V1090"/><g transform="translate(130 1100)"><rect class="g" width="740" height="85" rx="18"/><text class="l" x="370" y="52">Human review: approve or reject</text></g></svg>
