<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="850" viewBox="0 0 1800 850" role="img" aria-labelledby="title desc">
  <title id="title">Three evidence-preserving workflow shapes</title><desc id="desc">Deterministic, single-planner, and researcher critic writer workflows all start from the same corpus and end at the same human approval boundary without a write step.</desc>
  <style>.box{fill:#f7f7f4;stroke:#243447;stroke-width:5}.accent{fill:#dcecf5;stroke:#1e628c;stroke-width:5}.review{fill:#fff1d6;stroke:#9a6719;stroke-width:5}.human{fill:#e6f2df;stroke:#477a39;stroke-width:5}.label{font:700 29px Arial,sans-serif;fill:#17212b;text-anchor:middle}.small{font:24px Arial,sans-serif;fill:#34495e;text-anchor:middle}.arrow{stroke:#425466;stroke-width:7;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#425466"/></marker></defs><rect width="1800" height="850" fill="white"/>
  <text x="900" y="62" class="label" style="font-size:40px">Choose the smallest workflow that preserves evidence and a human boundary</text>
  <g transform="translate(55 130)"><rect class="box" width="285" height="150" rx="20"/><text x="142" y="60" class="label">frozen corpus</text><text x="142" y="107" class="small">paths + citations +</text><text x="142" y="138" class="small">editorial checks</text></g>
  <path class="arrow" d="M350 205H465"/><path class="arrow" d="M350 205H415V425H465"/><path class="arrow" d="M350 205H390V655H465"/>
  <g transform="translate(480 130)"><rect class="accent" width="335" height="150" rx="20"/><text x="167" y="60" class="label">deterministic workflow</text><text x="167" y="107" class="small">retrieve + audit +</text><text x="167" y="138" class="small">manual proposal</text></g><path class="arrow" d="M825 205H980"/>
  <g transform="translate(480 350)"><rect class="accent" width="335" height="150" rx="20"/><text x="167" y="60" class="label">single planner</text><text x="167" y="107" class="small">one context, one plan,</text><text x="167" y="138" class="small">one review contract</text></g><path class="arrow" d="M825 425H980"/>
  <g transform="translate(480 580)"><rect class="accent" width="335" height="150" rx="20"/><text x="167" y="54" class="label">specialist roles</text><text x="167" y="101" class="small">researcher → critic →</text><text x="167" y="132" class="small">writer brief (no tools)</text></g><path class="arrow" d="M825 655H980"/>
  <g transform="translate(995 285)"><rect class="review" width="330" height="250" rx="20"/><text x="165" y="65" class="label">shared contract</text><text x="165" y="112" class="small">cite a real path</text><text x="165" y="151" class="small">surface editorial gaps</text><text x="165" y="190" class="small">no source or Git write</text><text x="165" y="229" class="small">record a proposal</text></g><path class="arrow" d="M1335 410H1465"/>
  <g transform="translate(1480 285)"><rect class="human" width="265" height="250" rx="20"/><text x="132" y="65" class="label">human review</text><text x="132" y="115" class="small">approve or reject</text><text x="132" y="158" class="small">the specific</text><text x="132" y="189" class="small">proposal</text><text x="132" y="229" class="small">still no write</text></g>
  <text x="900" y="805" class="small" style="font-size:27px">Extra roles add handoffs and cost. They are justified only if they improve a declared evaluation without weakening provenance or approval.</text>
</svg>
